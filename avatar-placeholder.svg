<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <rect width="400" height="400" rx="40" fill="url(#ambientGlow)" />

  <!-- Subtle Circuit Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.15" stroke-linecap="round">
    <path d="M 40 100 L 100 100 L 140 140" fill="none"/>
    <circle cx="40" cy="100" r="3" fill="#38bdf8"/>
    <path d="M 360 100 L 300 100 L 260 140" fill="none"/>
    <circle cx="360" cy="100" r="3" fill="#38bdf8"/>
    <path d="M 50 320 L 120 320 L 150 290" fill="none"/>
    <circle cx="50" cy="320" r="3" fill="#38bdf8"/>
    <path d="M 350 320 L 280 320 L 250 290" fill="none"/>
    <circle cx="350" cy="320" r="3" fill="#38bdf8"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 4"/>
  <circle cx="200" cy="180" r="124" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>

  <!-- Glowing Aura -->
  <circle cx="200" cy="180" r="85" fill="#1e293b" opacity="0.6"/>

  <!-- Stylized Modern Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="140" r="48" fill="url(#silhouetteGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Body / Shoulders -->
  <path d="M 115 280 C 115 220, 150 205, 200 205 C 250 205, 285 220, 285 280 Z" fill="url(#silhouetteGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Monogram Badge -->
  <g transform="translate(160, 315)">
    <rect width="80" height="32" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ECE • MR</text>
  </g>
</svg>
